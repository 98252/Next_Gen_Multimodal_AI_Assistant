<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Sky & Mountain Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="snowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="hillsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Circular Base Frame / Background -->
  <circle cx="250" cy="230" r="170" fill="url(#skyGrad)" filter="url(#glow)"/>

  <!-- Mountain Sagarmatha (Mt. Everest) -->
  <polygon points="120,310 250,135 380,310" fill="url(#mountainGrad)"/>
  <!-- Mountain Snow Caps & Ridges -->
  <polygon points="250,135 210,200 235,190 220,230 250,210 280,240 265,190 290,200" fill="url(#snowGrad)"/>
  <polygon points="180,250 210,200 235,230 200,260" fill="url(#snowGrad)"/>
  <polygon points="320,250 290,200 265,230 300,260" fill="url(#snowGrad)"/>

  <!-- Green Hills -->
  <path d="M 85,280 Q 170,230 250,270 Q 330,230 415,280 L 415,350 L 85,350 Z" fill="url(#hillsGrad)"/>

  <!-- Nepal Flag on top of Mount Everest -->
  <g transform="translate(242, 80) scale(0.9)">
    <!-- Flag Pole -->
    <rect x="0" y="0" width="3" height="58" fill="#cbd5e1"/>
    <circle cx="1.5" cy="0" r="3" fill="#f59e0b"/>
    <!-- Double Pennon Flag -->
    <path d="M 3,5 L 35,25 L 14,25 L 35,48 L 3,48 Z" fill="#dc2626" stroke="#1d4ed8" stroke-width="2.5"/>
    <!-- Sun & Moon Symbols -->
    <!-- Moon in upper pennon -->
    <path d="M 10,17 A 4,4 0 1,0 18,17 A 3,3 0 1,1 10,17 Z" fill="#ffffff"/>
    <!-- Sun in lower pennon -->
    <circle cx="14" cy="38" r="4.5" fill="#ffffff"/>
  </g>

  <!-- White Silhouette Map of Nepal -->
  <path d="M 150,265 C 165,250 185,260 210,250 C 235,240 260,255 290,245 C 315,240 335,255 350,260 C 355,275 340,290 325,295 C 300,300 280,290 250,305 C 220,315 190,300 170,305 C 150,300 145,280 150,265 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#glow)"/>

  <!-- Handshake in the foreground representing unity -->
  <g transform="translate(170, 310) scale(0.8)">
    <!-- Male/Female Handshake -->
    <!-- Left Hand with red bangles -->
    <rect x="25" y="10" width="18" height="30" rx="4" fill="#dc2626"/>
    <path d="M 40,25 Q 70,25 90,30 Q 80,45 60,45 L 40,45 Z" fill="#fed7aa"/>
    <!-- Right Hand -->
    <path d="M 125,25 Q 95,25 75,30 Q 85,45 105,45 L 125,45 Z" fill="#ffedd5"/>
    <circle cx="82" cy="35" r="14" fill="none" stroke="#f97316" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- Golden Ears of Paddy (Wheat/Rice wreath at base) -->
  <path d="M 130,375 C 180,410 320,410 370,375" fill="none" stroke="#eab308" stroke-width="10" stroke-linecap="round"/>
  <path d="M 150,365 C 200,395 300,395 350,365" fill="none" stroke="#facc15" stroke-width="6" stroke-linecap="round"/>

  <!-- Rhododendron (Lali Gurans) Red Garland -->
  <!-- Left Side Flowers -->
  <g fill="#dc2626" stroke="#991b1b" stroke-width="1.5">
    <circle cx="100" cy="220" r="16"/>
    <circle cx="115" cy="165" r="16"/>
    <circle cx="150" cy="120" r="16"/>
    <circle cx="195" cy="90" r="16"/>
    <circle cx="105" cy="275" r="16"/>
    <circle cx="130" cy="325" r="16"/>
    <!-- Right Side Flowers -->
    <circle cx="400" cy="220" r="16"/>
    <circle cx="385" cy="165" r="16"/>
    <circle cx="350" cy="120" r="16"/>
    <circle cx="305" cy="90" r="16"/>
    <circle cx="395" cy="275" r="16"/>
    <circle cx="370" cy="325" r="16"/>
  </g>

  <!-- Rhododendron Flower Petal Highlights -->
  <g fill="#ef4444">
    <circle cx="98" cy="218" r="8"/>
    <circle cx="113" cy="163" r="8"/>
    <circle cx="148" cy="118" r="8"/>
    <circle cx="193" cy="88" r="8"/>
    <circle cx="103" cy="273" r="8"/>
    <circle cx="128" cy="323" r="8"/>

    <circle cx="398" cy="218" r="8"/>
    <circle cx="383" cy="163" r="8"/>
    <circle cx="348" cy="118" r="8"/>
    <circle cx="303" cy="88" r="8"/>
    <circle cx="393" cy="273" r="8"/>
    <circle cx="368" cy="323" r="8"/>
  </g>

  <!-- Red Ribbon at Base -->
  <path d="M 60,395 Q 250,470 440,395 L 430,425 Q 250,490 70,425 Z" fill="url(#ribbonGrad)" filter="url(#glow)"/>
  <!-- Ribbon Tails -->
  <polygon points="60,395 70,425 40,435 50,410" fill="#991b1b"/>
  <polygon points="440,395 430,425 460,435 450,410" fill="#991b1b"/>

  <!-- National Motto in Sanskrit on Ribbon -->
  <text x="250" y="445" font-family="'Mukta', 'Noto Sans Devanagari', sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    जननी जन्मभूमिश्च स्वर्गादपि गरीयसी
  </text>
</svg>
